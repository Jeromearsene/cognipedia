name: Link check

on:
  pull_request:
    branches: [main, staging]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 🔗 Check bias links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Pull requests need the base branch history to find the links they add
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check links
        run: pnpm test:links
        env:
          # On pull requests, only check the links added by the PR.
          # Scheduled and manual runs check every link.
          LINKS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
